<h2 mat-dialog-title>Edit Item</h2>

<div mat-dialog-content [formGroup]="form">
  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Species</mat-label>
    <input matInput formControlName="species" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Status</mat-label>
    <input matInput formControlName="status" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Gender</mat-label>
    <input matInput formControlName="gender" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Origin</mat-label>
    <input matInput formControlName="origin" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Quote</mat-label>
    <input matInput formControlName="quote" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Author</mat-label>
    <input matInput formControlName="author" /> 
  </mat-form-field>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="dialogRef.close()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()">Save</button>
</div>

<div class="card">
  <img class="avatar" [src]="(response | async)?.results[0]?.picture?.large"/>
  <div class="info">
    <h2>User Info</h2>
    <p>
      <b>Name:</b> {{ (response | async)?.results[0]?.name?.first }} {{ (response | async)?.results[0]?.name?.last }}
    </p>
    <p>
      <b>Email:</b> {{ (response | async)?.results[0]?.email }}
    </p>
    <p>
      <b>Location:</b> {{ (response | async)?.results[0]?.location?.city }}, {{ (response | async)?.results[0]?.location?.country }}
    </p>
  </div>
</div>

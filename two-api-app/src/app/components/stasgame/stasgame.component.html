  <div class="game-panel">
    <div class="user-turn">
      <label>Твой ход:</label>
      <input #a type="number" placeholder="Введите число" />
      <button (click)="play(+a.value)">Сказать</button>
      <button (click)="reset()">Новая игра</button>
    </div>

    <div class="comp-turn" *ngIf="compTurn">
      <label>Ответ компу:</label>
      <button (click)="answer('less')">Меньше</button>
      <button (click)="answer('more')">Больше</button>
      <button (click)="answer('eq')">Равно</button>
    </div>

    <div class="log">
      @for (x of log; track x.id) {
        <div class="log-item">{{ x.text }}</div>
      }
    </div>
  </div>
  <button mat-button (click)="goBack()" style="margin-top: 8px">Назад</button>
</div>

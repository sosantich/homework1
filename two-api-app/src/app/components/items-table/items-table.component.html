<div class="filters">
  <mat-form-field>
    <mat-label>Gender</mat-label>
    <mat-select [(value)]="selectedGender" (selectionChange)="applyFilter()">
      <mat-option value="">All</mat-option>
      <mat-option value="male">Male</mat-option>
      <mat-option value="female">Female</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Species</mat-label>
    <mat-select [(value)]="selectedSpecies" (selectionChange)="applyFilter()">
      <mat-option value="">All</mat-option>
      <mat-option value="human">Human</mat-option>
      <mat-option value="alien">Alien</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Status</mat-label>
    <mat-select [(value)]="selectedStatus" (selectionChange)="applyFilter()">
      <mat-option value="">All</mat-option>
      <mat-option value="alive">Alive</mat-option>
      <mat-option value="dead">Dead</mat-option>
      <mat-option value="unknown">Unknown</mat-option>
    </mat-select>
  </mat-form-field>
  <button mat-button (click)="goToGame()" style="padding: 8px">Играть в StasGame</button>
</div>
<mat-form-field>
  <mat-label>Search</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Enter data" #input />
</mat-form-field>

<table mat-table [dataSource]="dataSource" matSort>
  <ng-container matColumnDef="image">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let x">
      <img [src]="x.image" width="67" />
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
    <td mat-cell *matCellDef="let x" (dblclick)="openEdit(x)">
      {{ x.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="species">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Species</th>
    <td mat-cell *matCellDef="let x" (dblclick)="openEdit(x)">{{ x.species }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
    <td mat-cell *matCellDef="let x" (dblclick)="openEdit(x)">{{ x.status }}</td>
  </ng-container>

  <ng-container matColumnDef="gender">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Gender</th>
    <td mat-cell *matCellDef="let x" (dblclick)="openEdit(x)">{{ x.gender }}</td>
  </ng-container>

  <ng-container matColumnDef="origin">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Origin</th>
    <td mat-cell *matCellDef="let x" (dblclick)="openEdit(x)">{{ x.origin }}</td>
  </ng-container>

  <ng-container matColumnDef="quote">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Favorite quote</th>
    <td mat-cell *matCellDef="let x" (dblclick)="openEdit(x)">{{ x.quote }}</td>
  </ng-container>

  <ng-container matColumnDef="author">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Author</th>
    <td mat-cell *matCellDef="let x" (dblclick)="openEdit(x)">{{ x.author }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let x">
      <button mat-button (click)="delete(x)">Delete</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
